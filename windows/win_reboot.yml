---
- name: win_reboot module demo
  hosts: windows
  become: false
  gather_facts: false
  tasks:
    - name: Reboot the Windows host(s)
      ansible.windows.win_reboot:
        pre_reboot_delay: 5
        post_reboot_delay: 10
        msg: "Rebooting the system as part of Ansible playbook execution."
      register: reboot_result